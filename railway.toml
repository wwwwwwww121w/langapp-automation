[build]
builder = "dockerfile"

[deploy]
startCommand = "python bot/telegram_bot_grok_v3.py"

[[services]]
name = "telegram"
builder = "dockerfile"
rootDirectory = "."

[services.variables]
TELEGRAM_BOT_TOKEN = "${TELEGRAM_BOT_TOKEN}"
TELEGRAM_ADMIN_ID = "${TELEGRAM_ADMIN_ID}"
XAI_API_KEY = "${XAI_API_KEY}"
XAI_VIDEO_MODEL = "${XAI_VIDEO_MODEL}"
XAI_VIDEO_DURATION = "${XAI_VIDEO_DURATION}"
XAI_VIDEO_ASPECT_RATIO = "${XAI_VIDEO_ASPECT_RATIO}"
XAI_VIDEO_RESOLUTION = "${XAI_VIDEO_RESOLUTION}"
FIREWORKS_API_KEY = "${FIREWORKS_API_KEY}"
PYTHONUNBUFFERED = "1"
